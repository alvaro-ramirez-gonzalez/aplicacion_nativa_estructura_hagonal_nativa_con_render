plugins {
    id 'com.android.application'
}

def apiBaseUrl = (project.findProperty('API_BASE_URL') ?: 'https://users-management-api-ptmc.onrender.com/').toString()
if (!apiBaseUrl.endsWith('/')) { apiBaseUrl += '/' }
def apiBaseUrlDebug = (project.findProperty('API_BASE_URL_DEBUG') ?: apiBaseUrl).toString()
if (!apiBaseUrlDebug.endsWith('/')) { apiBaseUrlDebug += '/' }

android {
    namespace 'com.example.gestionusuarios'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.gestionusuarios'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrlDebug + '"'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl + '"'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
